<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Buzón de Sugerencias — Bienestar Universitario</title>
  </head>
  <body>
    <h1>Buzón de Sugerencias — Bienestar Universitario</h1>
    <form id="formulario">
      <input type="text" name="nombre" placeholder="Nombre (opcional)" />
      <select name="categoria">
        <option value="Salud mental">Salud mental</option>
        <option value="Deportes y recreación">Deportes y recreación</option>
        <option value="Apoyo psicológico">Apoyo psicológico</option>
      </select>
      <textarea name="mensaje" required></textarea>
      <button type="submit">Enviar</button>
    </form>

    <script src="script.js"></script>
  </body>
</html>
